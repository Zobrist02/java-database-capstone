name: Lint Dockerfile

on: [push, pull_request]

jobs:
  dockerlint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile