<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient Dashboard | Smart Clinic</title>
    <link rel="icon" type="image/png" href="../assets/images/logo/logo.png">
    <link rel="stylesheet" href="../assets/css/adminDashboard.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/patientDashboard.css">

    <script src="../js/render.js" defer></script>
    <script src="../js/util.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script src="../js/components/header.js" type="module" defer></script>
    <script type="module" src="../js/patientDashboard.js" defer></script>
</head>
<body onload="renderContent()">
<div class="container">
    <div class="wrapper">
        <div id="header"></div>

        <main class="main-content">
            <section class="dashboard-heading">
                <p class="eyebrow">Find care that fits your needs</p>
                <h1>Find a Doctor</h1>
            </section>

            <section class="patient-toolbar" aria-label="Search and filter doctors">
                <label class="visually-hidden" for="searchBar">Search doctors</label>
                <input
                        type="search"
                        id="searchBar"
                        class="searchBar"
                        placeholder="Search by doctor name">

                <div class="filter-wrapper">
                    <label class="visually-hidden" for="filterTime">Filter by time</label>
                    <select class="filter-select" id="filterTime">
                        <option value="">Any time</option>
                        <option value="AM">Morning</option>
                        <option value="PM">Afternoon</option>
                    </select>

                    <label class="visually-hidden" for="filterSpecialty">Filter by specialty</label>
                    <select class="filter-select" id="filterSpecialty">
                        <option value="">All specialties</option>
                        <option value="cardiologist">Cardiology</option>
                        <option value="dermatologist">Dermatology</option>
                        <option value="neurologist">Neurology</option>
                        <option value="orthopedic">Orthopedics</option>
                        <option value="general">General Physician</option>
                    </select>
                </div>
            </section>

            <section id="content" class="doctor-grid" aria-live="polite">
                <p class="empty-state">Available doctors will appear here.</p>
            </section>
        </main>

        <div id="footer"></div>
    </div>
</div>

<div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <button type="button" id="closeModal" class="close" aria-label="Close">&times;</button>
        <div id="modal-body"></div>
    </div>
</div>
</body>
</html>
