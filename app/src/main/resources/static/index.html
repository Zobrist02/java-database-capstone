<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Your Role | Smart Clinic</title>
    <link rel="icon" type="image/png" href="./assets/images/logo/logo.png">
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>
    <script src="./js/components/header.js" type="module" defer></script>
    <script src="./js/components/footer.js" defer></script>
    <script src="./js/services/index.js" type="module" defer></script>
</head>
<body>
<div class="container">
    <div class="wrapper">
        <div id="header"></div>

        <main class="main-content">
            <section class="role-panel" aria-labelledby="role-heading">
                <p class="eyebrow">Smart Clinic Management System</p>
                <h1 id="role-heading">Select Your Role</h1>
                <p class="intro">Choose how you want to continue.</p>

                <div class="role-buttons">
                    <button type="button" id="adminRole" class="role-button">Admin</button>
                    <button type="button" id="doctorRole" class="role-button">Doctor</button>
                    <button type="button" id="patientRole" class="role-button">Patient</button>
                </div>
            </section>
        </main>

        <div id="footer"></div>
    </div>
</div>

<div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <button type="button" id="closeModal" class="close" aria-label="Close">&times;</button>
        <div id="modal-body"></div>
    </div>
</div>
</body>
</html>
