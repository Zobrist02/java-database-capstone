<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Dashboard | Smart Clinic</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/header.js}" type="module" defer></script>
    <script th:src="@{/js/doctorDashboard.js}" type="module" defer></script>
</head>
<body onload="renderContent()">
<div class="container">
    <div class="wrapper">
        <div id="header"></div>

        <main class="main-content">
            <section class="dashboard-heading">
                <p class="eyebrow">Appointments and patient records</p>
                <h1>Doctor Dashboard</h1>
            </section>

            <section class="doctor-toolbar">
                <label class="visually-hidden" for="searchBar">Search patients</label>
                <input id="searchBar" type="search" placeholder="Search by patient name">
                <button type="button" id="todayButton" class="button">Today's Appointments</button>
                <label class="visually-hidden" for="datePicker">Choose appointment date</label>
                <input id="datePicker" type="date">
            </section>

            <div class="table-wrap">
                <table id="patientTable">
                    <thead>
                    <tr>
                        <th scope="col">Patient ID</th>
                        <th scope="col">Name</th>
                        <th scope="col">Phone</th>
                        <th scope="col">Email</th>
                        <th scope="col">Prescription</th>
                    </tr>
                    </thead>
                    <tbody id="patientTableBody">
                    <tr>
                        <td colspan="5" class="noPatientRecord">Appointments will appear here.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div id="footer"></div>
    </div>
</div>
</body>
</html>
