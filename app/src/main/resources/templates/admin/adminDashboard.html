<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | Smart Clinic</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/header.js}" type="module" defer></script>
    <script th:src="@{/js/adminDashboard.js}" type="module" defer></script>
</head>
<body onload="renderContent()">
<div class="container">
    <div class="wrapper">
        <div id="header"></div>

        <main class="main-content">
            <section class="dashboard-heading">
                <p class="eyebrow">Clinic management</p>
                <h1>Admin Dashboard</h1>
                <p>Search and filter doctor profiles.</p>
            </section>

            <section class="toolbar" aria-label="Doctor search and filters">
                <label class="visually-hidden" for="searchBar">Search by doctor name</label>
                <input id="searchBar" type="search" placeholder="Search by doctor name">

                <label class="visually-hidden" for="filterTime">Filter by availability</label>
                <select id="filterTime">
                    <option value="">All times</option>
                    <option value="AM">Morning</option>
                    <option value="PM">Afternoon</option>
                </select>

                <label class="visually-hidden" for="filterSpecialty">Filter by specialty</label>
                <select id="filterSpecialty">
                    <option value="">All specialties</option>
                    <option value="cardiologist">Cardiology</option>
                    <option value="dermatologist">Dermatology</option>
                    <option value="neurologist">Neurology</option>
                    <option value="orthopedic">Orthopedics</option>
                    <option value="general">General Physician</option>
                </select>
            </section>

            <section id="content" class="doctor-grid" aria-live="polite">
                <p class="empty-state">Doctor profiles will appear here.</p>
            </section>
        </main>

        <div id="footer"></div>
    </div>
</div>

<div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <button type="button" id="closeModal" class="close" aria-label="Close">&times;</button>
        <div id="modal-body"></div>
    </div>
</div>
</body>
</html>
